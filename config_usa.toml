# Cartera de EE. UU. en Trading 212 (cuenta en EUR, líneas en USD _US_EQ: 0,15 % de cambio por operación,
# ya contado como comisión). Sesión de Nueva York (15:30-22:00 en Madrid; sigue sola los cambios de hora de
# EE. UU.). Cada orden te la propone por Telegram (✅/❌). Empieza en PAPEL para la fase de comprobación.
# En Telegram se elige con la palabra "usa" (/estado usa...).

[general]
portfolio = "usa"         # palabra de la cartera en Telegram
label = "🇺🇸 EE. UU."        # etiqueta de sus avisos
mode = "paper"            # "live" = Trading 212 real (exige CONFIRM_LIVE=yes y claves)
engine = "stocks"         # motor multiposición con propuestas (newsbot/stocks)
exchange = "yahoo"        # fuente de datos (features/yahoo.py); cada activo necesita [market.CODE]
# Universo: grandes y volátiles de EE. UU. (USD, convertidas a EUR con el cambio actual).
# El primero es el de referencia para la reoptimización. Cada código necesita [news.assets] y [market].
symbols = ["NVDA/EUR", "AMD/EUR", "SMCI/EUR", "TSLA/EUR", "META/EUR", "AMZN/EUR", "GOOGL/EUR", "AAPL/EUR",
           "MSFT/EUR", "PLTR/EUR", "COIN/EUR", "TTWO/EUR", "WMT/EUR", "XOM/EUR", "OXY/EUR",
           "NEM/EUR", "CEG/EUR", "VST/EUR", "GEV/EUR"]  # 8-nov: + eléctricas de los centros de datos de IA
initial_capital = 177.0    # referencia del P&L: toda la cuenta tras el ingreso del 6-nov (antes 29,45 €)
timezone = "Europe/Madrid"
data_dir = "data/usa_live" # datos del dinero real, aparte de los de la prueba (data/usa)
healthcheck_hours = 80
tick_minutes = 5          # ciclo base; [speed] lo acelera con volatilidad (mín. 2 min)

[weights]                 # deben sumar 1
# PRUEBA EN PAPEL (5-nov): con 180 días de datos, a 4 h vista estos valores VUELVEN A LA MEDIA
# (Bollinger IC +0,085 y RSI +0,068 aciertan; momentum −0,10 falla; tendencia 0). Se inclina la
# señal hacia comprar lo estirado a la baja y menos hacia seguir la subida. Si no mejora, se vuelve.
news = 0.35
trend = 0.10              # tendencia diaria (SMA10 vs SMA30): a 4 h no predice (IC 0,006)
intraday = 0.05           # impulso de las últimas horas: tampoco (IC −0,07)
events = 0.15             # eventos con fecha (presentaciones, lanzamientos, GTA VI...): sube antes, baja después
bollinger = 0.15          # precio por debajo de su banda = barato a corto plazo (IC +0,085, significativo)
rsi = 0.10                # sobreventa (IC +0,068)
dip = 0.10                # caída fuerte con tendencia de fondo alcista: rebote
fng = 0.0                 # Fear & Greed es de cripto: no se usa (news.fng = false)
votes = 0.0               # votos de CryptoPanic: no hay para acciones
# Componentes "sombra": rsi, bollinger, momentum, volume, breakout (canal de 20 días), macd y high52
# (cercanía al máximo de 52 semanas) se calculan y se miden en cada tick, pero solo
# operan si tienen peso aquí o en una propuesta aprobada (/aprobar bolsa N). Sin peso = 0.

[strategy]
buy_threshold = 0.22      # live: solo señales claras (en papel era 0,15); [adaptive] lo ajusta solo
buy_threshold_bear = 0.35 # umbral de compra si el precio está por debajo de la SMA200
sell_threshold = -0.10    # sale cuando la señal se tuerce de verdad (no por ruido)
news_ema_days = 3         # EMA sobre el sentimiento: un titular suelto no cambia la decisión
sma_fast = 10
sma_slow = 30
sma_regime = 200
intraday_timeframe = "15m"
ema_fast = 8              # 8 velas de 15 min = 2 h
ema_slow = 32             # 32 velas de 15 min = 8 h (≈ una sesión)

[risk]
max_exposure = 1.0
min_rebalance_pct = 0.20
stop_loss_pct = 0.08
trailing_stop_pct = 0.015 # asegura ganancias: vende si cae un 1,5 % desde el máximo
max_drawdown_pct = 0.20   # kill-switch: si pierde el 20 % (≈ 6 €), solo vende/mantiene hasta /reanudar
vol_target = 0.0          # volatilidad anual objetivo; 0 = desactivado
edge_cost_multiple = 1.5  # movimiento esperado >= 1,5 × coste de ida y vuelta
atr_days = 14
min_order_eur = 1.0
max_trades_per_day = 3    # operaciones como máximo al día (después solo actúan los stops)
cooldown_minutes = 60     # tras vender un valor, no lo vuelve a comprar en 60 min (evita recomprar el mismo error)

[costs]                   # estilo Trading 212: 0 € de comisión; el spread va en el deslizamiento
fee_pct = 0.0015           # 0,15 % de cambio de divisa de Trading 212 en cada compra y venta
slippage_pct = 0.0005      # spread de valores muy líquidos de EE. UU.

[execution]
order_type = "market"
limit_timeout_min = 15
operator_id = 0           # solo Bitvavo lo usa
broker = "trading212"     # dinero real
t212_env = "live"         # cuenta real (la clave de demo es otra)
confirm = true            # obligatorio con Trading 212: cada orden espera tu ✅ en Telegram
proposal_minutes = 5      # mercado rápido: una propuesta caduca a los 5 min (el precio ya habrá cambiado)
max_proposals_day = 12    # como mucho 12 propuestas al día (cada una necesita tu ✅)
reject_cooldown_hours = 4 # si dices que no, no vuelve a proponer ese valor en 4 h (salvo stop-loss)
max_order_eur = 20.0      # tope por orden (6-nov, con ~170 €: ≈ 12 %; antes 12 €). Regla 12-nov: 8-10 cerradas en positivo -> 30 €
price_drift_max = 0.015   # si al confirmar el precio se ha movido > 1,5 %, no ejecuta y avisa
broker_stop = true        # tras comprar, deja el stop-loss puesto en Trading 212 (funciona con el PC apagado)

[portfolio]               # equilibrio: nunca todo en una apuesta
# budget_eur sin poner: desde el 6-nov usa TODA la cuenta (Europa en cierre, ver config_bolsa.toml)
max_positions = 2         # como mucho 2 valores a la vez
max_position_pct = 0.35   # cada posición, como mucho el 35 % del capital
max_group_pct = 0.50      # cada sector (defensa, chips...), como mucho el 50 %
max_group_positions = 2   # y como mucho 2 valores del mismo sector
min_cash_pct = 0.20       # siempre queda al menos un 20 % en efectivo
risk_per_trade_pct = 0.02 # si salta el stop, se pierde como mucho un 2 % del capital: los valores más
atr_stop_mult = 2.5       # volátiles llevan posiciones más pequeñas (stop a 2,5 × ATR, entre 3 % y 12 %)

# Niveles por capital: con poco dinero, 1-2 posiciones y recoger beneficios pronto (+4 % ≈ 1 € con 20 €);
# al crecer, más reparto y dejar correr. El primer nivel cuyo "up_to_eur" cubre el capital manda.
[[portfolio.tiers]]
name = "semilla (hasta 50 €)"
up_to_eur = 50.0
max_positions = 2
max_position_pct = 0.45
max_group_pct = 0.60
min_cash_pct = 0.10
risk_per_trade_pct = 0.03
take_profit_pct = 0.02    # live: objetivo +2 % (≈ +1,6 % neto tras el 0,4 % de cambio de divisa)

[[portfolio.tiers]]
name = "crecimiento (50-250 €)"
up_to_eur = 250.0
max_positions = 3
max_position_pct = 0.35
max_group_pct = 0.50
min_cash_pct = 0.15
risk_per_trade_pct = 0.025
take_profit_pct = 0.03

[[portfolio.tiers]]
name = "consolidación (250-1000 €)"
up_to_eur = 1000.0
max_positions = 4
max_position_pct = 0.30
max_group_pct = 0.50
min_cash_pct = 0.15
risk_per_trade_pct = 0.02
take_profit_pct = 0.04

[[portfolio.tiers]]
name = "proporcional (más de 1000 €)"
max_positions = 5
max_position_pct = 0.25
max_group_pct = 0.45
min_cash_pct = 0.20
risk_per_trade_pct = 0.015
take_profit_pct = 0.0     # sin objetivo fijo: deja correr con el trailing stop

[kronos]                  # modelo de velas preentrenado, en tu CPU (no gasta Claude). Componente "kronos" en
enabled = true            # sombra: se mide en cada ciclo y learn le da peso solo si acierta de verdad
size = "mini"             # mini: ~7 s para los 13 valores; small: ~40 s (más preciso, más lento)
pred_len = 8              # velas de 15 min previstas (2 h)

[local_news]              # FinBERT puntúa cada titular en tu ordenador (sin gastar Claude): componente
enabled = true            # sombra "finbert" y, si llega un titular nuevo y muy marcado, adelanta Claude
breaking = 0.80           # tono mínimo (de 1) para considerarlo noticia fuerte
min_weight = 0.5          # y peso mínimo (fuente fiable y reciente)

[adaptive]                # umbral de compra que se ajusta solo: más exigente si pierde, más atrevido si gana
enabled = true
min_trades = 4            # empieza a ajustar con 4 operaciones cerradas
window = 6                # mira las últimas 6 operaciones cerradas
step = 0.02               # cada ajuste mueve el umbral 0,02
min_offset = -0.05        # nunca por debajo de 0,17 (0,22 − 0,05)
max_offset = 0.15

[speed]                   # ciclo variable: rápido cuando el mercado se mueve, lento cuando está plano
min_minutes = 1           # mercado moviéndose: un ciclo por minuto (vigila stops y objetivos de cerca)
max_minutes = 10
fast_above = 0.5          # impulso intradía mediano (|0-1|) a partir del cual va al mínimo
slow_below = 0.15         # por debajo, al máximo
near_stop_pct = 0.015     # o si una posición está a menos de un 1,5 % de su stop

[events]                  # Claude lee las noticias y apunta los eventos con fecha de cada empresa
enabled = true
refresh_hours = 4         # cada cuánto busca eventos nuevos en los titulares
lookahead_days = 30       # eventos de los próximos 30 días
pre_days = 7              # el efecto crece en los 7 días previos (compra el rumor)...
post_days = 3             # ...y se da la vuelta 3 días después (vende la noticia)
llm_max_calls_day = 3     # tope de llamadas a Claude para eventos (8-nov: antes 8)

[sentiment]
cascade = ["llm"]         # léxico y FinBERT miden el tono, no el efecto: una guerra es "negativa" pero
fallback = "none"         # sube el oro y la defensa. Sin LLM la noticia cuenta 0 (no el léxico)
llm_model = "claude-haiku-5-5"
finbert_model = "ProsusAI/finbert"
debate = false
anonymize = false         # las noticias de competidores (contratos, pedidos) sí informan
llm_min_minutes = 390     # 8-nov: una lectura de Claude por valor y sesión (antes 180)
llm_max_calls_day = 20    # 8-nov: ≈ 1 por valor y día (antes 60): ahorro, las noticias aún no prueban que acierten

[session]                 # sesión de Nueva York: 09:35-16:00 hora de EE. UU. (15:35-22:00 en Madrid)
tz = "America/New_York"
days = [0, 1, 2, 3, 4]
open = "09:35"            # 5 min tras la apertura: sin la subasta
close = "16:00"

