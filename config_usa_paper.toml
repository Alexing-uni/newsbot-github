[watch]                   # vigilante de noticias: no adelanta decisiones en bolsa (de momento)
enabled = false
window_hours = 3
min_sources = 3
min_strength = 0.5

[adapt]
enabled = true
cadence_days = 14         # umbrales de compra y venta: walk-forward cada 2 semanas
auto_apply_in_paper = true
auto_apply_live = true    # como en cripto: se ajusta sola (±0,05, límites duros, /deshacer bolsa N)
max_weight_step = 0.15
lookback_days = 730
train_days = 180
test_days = 60
mc_runs = 100

[learn]                   # retroalimentación: cada tick se compara después con el precio real
enabled = true
horizon = "4h"
lookback_days = 180       # 58 días en velas de 15 min (lo que da Yahoo) + el resto en velas de 1 h
min_n_eff = 400
independent_bets = 5      # 16 valores de 6 sectores ≈ 5 apuestas independientes (cripto: 2)
max_step = 0.05
shrinkage_k = 400
cadence_days = 7
auto_apply_live = true
cost = 0.004              # ida y vuelta: 2 × (0,15 % cambio + 0,05 % spread)
min_abs = 0.05
