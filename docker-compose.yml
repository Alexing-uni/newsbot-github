# Servicio continuo: un tick cada general.tick_minutes (5 min por defecto). Se reinicia solo si se
# cae o si el equipo se reinicia (con Docker arrancando al inicio).
#   docker compose up -d --build        # arrancar en segundo plano
#   docker compose logs -f              # ver lo que hace en directo
#   docker compose stop                 # parar
#   docker compose run --rm newsbot python -m newsbot.bot --dry-run   # decisión sin guardar nada
services:
  newsbot:
    build: .
    image: newsbot:latest
    command: ["python", "-m", "newsbot.bot", "--loop"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
