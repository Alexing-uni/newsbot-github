[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsbot"
version = "0.1.0"
description = "Bot de inversión educativo guiado por noticias: cripto (Bitvavo) y bolsa UE/EE. UU. (Trading 212), papel por defecto"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4",
    "feedparser>=6.0",
    "anthropic>=0.70",
    "pydantic>=2",
    "tzdata",  # zoneinfo en Windows/contenedores slim
]

[project.optional-dependencies]
finbert = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380"]

[tool.setuptools.packages.find]
include = ["newsbot*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
